[binaries]
ar = 'i686-w64-mingw32-ar'
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'

[built-in options]
# Avoid requiring libwinpthread-1.dll
cpp_link_args = ['-static']

[host_machine]
cpu_family = 'x86'
kernel = 'nt'
system = 'windows'
endian = 'little'
cpu = 'i686'
